# parity-cc-tools' Kubernetes rights (PLAN.md §6.4), requested from the platform engineer (parity-deploy
# owns the cluster objects; this file is the request, in its exact form). Namespace parity-ops.
# Read: pods, endpointslices, deployments, statefulsets in the platform namespaces the catalogue names.
# Write: patch pods (limited to the label parity.io/rotation by rotation-label-policy.yaml), and the scale
# subresource of the catalogue's k8s-scale workloads only (resourceNames). Nothing on secrets, exec, delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parity-cc-tools
  namespace: parity-ops
  labels: {app.kubernetes.io/name: parity-cc-tools, app.kubernetes.io/part-of: parity}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parity-cc-tools-observe
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: parity-cc-tools-rotate
rules:
  # Only the label parity.io/rotation may change (ValidatingAdmissionPolicy parity-cc-tools-rotation-label-only).
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
# One RoleBinding per platform namespace the catalogue names (k3s: parity-app, parity-web, parity-media,
# parity-edge, parity-identity, parity-data). Shown for parity-app; repeat for each.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parity-cc-tools-observe, namespace: parity-app}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parity-cc-tools-observe}
subjects: [{kind: ServiceAccount, name: parity-cc-tools, namespace: parity-ops}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parity-cc-tools-rotate, namespace: parity-app}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: parity-cc-tools-rotate}
subjects: [{kind: ServiceAccount, name: parity-cc-tools, namespace: parity-ops}]
---
# The scale subresource of the catalogue's k8s-scale workloads only (resourceNames: from the catalogue).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: parity-cc-tools-scale, namespace: parity-app}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [parity-store-loader]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: []
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: parity-cc-tools-scale, namespace: parity-app}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: parity-cc-tools-scale}
subjects: [{kind: ServiceAccount, name: parity-cc-tools, namespace: parity-ops}]
